[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mcpqa"
version = "0.0.0"
description = "A reusable test suite for MCP servers: conformance, contracts and security checks."
requires-python = ">=3.12"
dependencies = ["httpx2>=2.16,<3", "pytest>=9,<10"]

[project.entry-points.pytest11]
mcpqa = "mcpqa.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpqa"]
