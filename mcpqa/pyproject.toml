[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mcpqa"
version = "0.0.0"
description = "A reusable test suite for MCP servers: conformance, contracts and security checks."
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcpqa"]
